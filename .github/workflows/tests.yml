name: Forensic portfolio tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run legacy investigation
        run: python src/investigate.py
      - name: Run case investigation
        run: python src/forensic_pipeline.py
      - name: Generate extended synthetic dataset
        run: python src/generate_extended_dataset.py
      - name: Run all tests
        run: python -m unittest discover -s tests -v
